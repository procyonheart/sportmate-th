<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>โปรไฟล์ผู้ใช้ — SportMate TH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;900&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #FF4D1C;
      --primary-glow: rgba(255,77,28,0.3);
      --border: rgba(255,255,255,0.08);
      --text: #F5F5F5;
      --muted: #A0A0A0;
      --dim: #505050;
    }

    html, body {
      min-height: 100%;
      background: #0A0A0A;
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: none;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.12); }

    .top-title {
      font-family: 'Kanit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* Hero section */
    .profile-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 24px;
      background: linear-gradient(160deg, rgba(255,77,28,0.06) 0%, transparent 60%);
      border: 1px solid var(--border);
      border-radius: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    .avatar-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      margin-bottom: 14px;
      overflow: hidden;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .profile-display-name {
      font-family: 'Kanit', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }

    .profile-username {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .verify-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      background: rgba(34,197,94,0.1);
      color: #22c55e;
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 20px;
      padding: 3px 10px;
      margin-bottom: 10px;
    }

    .join-date {
      font-size: 12px;
      color: var(--dim);
    }

    /* Info rows */
    .info-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 0;
      margin-bottom: 12px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .info-row:last-child { border-bottom: none; }

    .info-icon {
      font-size: 18px;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }

    .info-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 1px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    /* Sport chips */
    .sport-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .sport-chip {
      font-size: 12px;
      background: rgba(255,77,28,0.1);
      color: var(--primary);
      border: 1px solid rgba(255,77,28,0.2);
      border-radius: 20px;
      padding: 3px 10px;
    }

    .skill-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      border-radius: 20px;
      padding: 3px 10px;
      font-weight: 600;
    }
    .skill-beginner  { background: rgba(34,197,94,0.1);  color: #22c55e;  border: 1px solid rgba(34,197,94,0.2); }
    .skill-mid       { background: rgba(234,179,8,0.1);  color: #eab308;  border: 1px solid rgba(234,179,8,0.2); }
    .skill-advanced  { background: rgba(239,68,68,0.1);  color: #ef4444;  border: 1px solid rgba(239,68,68,0.2); }

    /* Back to dashboard button */
    .goto-dashboard {
      display: block;
      text-align: center;
      margin-top: 24px;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border-radius: 14px;
      font-family: 'Kanit', sans-serif;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }
    .goto-dashboard:hover { opacity: 0.88; }
    .goto-dashboard:active { transform: scale(0.98); }

    /* Loading / error */
    .center-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,77,28,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error-box { display: none; }
    #profile-box { display: none; }

    /* Avatar clickable when has photo */
    .avatar-ring.has-photo { cursor: pointer; }
    .avatar-ring.has-photo:hover { opacity: 0.85; }

    /* Lightbox */
    #photo-lightbox {
      display: none; position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      align-items: center; justify-content: center;
    }
    #photo-lightbox.open { display: flex; }
    #photo-lightbox img {
      max-width: 92vw; max-height: 88vh;
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.8);
      object-fit: contain;
      animation: lbIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes lbIn {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    #photo-lightbox-close {
      position: absolute; top: 16px; right: 16px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: none;
      color: #fff; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    #photo-lightbox-close:hover { background: rgba(255,255,255,0.22); }
  </style>
</head>
<body>

<!-- Photo Lightbox -->
<div id="photo-lightbox" onclick="closeLightbox()">
  <button id="photo-lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="photo-lightbox-img" src="" alt="รูปโปรไฟล์" onclick="event.stopPropagation()">
</div>

<div class="top-bar">
  <button class="back-btn" onclick="history.back()">‹</button>
  <div class="top-title" id="top-title">โปรไฟล์</div>
  <img src="brand_assets/icon.svg" style="width:28px;height:28px;opacity:0.7;" onerror="this.style.display='none'">
</div>

<div class="container">

  <!-- Loading -->
  <div class="center-box" id="loading-box">
    <div class="spinner"></div>
    <div>กำลังโหลดโปรไฟล์...</div>
  </div>

  <!-- Error -->
  <div class="center-box" id="error-box">
    <div style="font-size:40px;">😕</div>
    <div id="error-msg">ไม่พบผู้ใช้นี้</div>
    <a href="dashboard.html" style="color:var(--primary);font-weight:600;font-size:14px;">← กลับหน้าหลัก</a>
  </div>

  <!-- Profile content -->
  <div id="profile-box">

    <div class="profile-hero">
      <div class="avatar-ring" id="avatar-el">🏃</div>
      <div class="profile-display-name" id="display-name-el">—</div>
      <div class="profile-username" id="username-el">@—</div>
      <div id="verify-el"></div>
      <div class="join-date" id="join-date-el"></div>
    </div>

    <div class="info-card" id="info-card">
      <!-- populated by JS -->
    </div>

    <a href="dashboard.html" class="goto-dashboard">🏃 ดูกิจกรรมในพื้นที่</a>

  </div>

</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz2ByyVNuhwblvpPQf-Rxryr4POeV-MXpxO_NPxUv-SeULIk1shuc2gsbrxCpl-pi_rgA/exec';

const SKILL_LABELS = {
  beginner: { th: 'มือใหม่', cls: 'skill-beginner', icon: '🌱' },
  mid:      { th: 'กลาง',   cls: 'skill-mid',       icon: '⚡' },
  advanced: { th: 'เชี่ยวชาญ', cls: 'skill-advanced', icon: '🔥' }
};

const GENDER_LABELS = { male: 'ชาย', female: 'หญิง', other: 'อื่นๆ' };

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long' });
}

async function loadProfile() {
  const params = new URLSearchParams(window.location.search);
  const username = params.get('user');

  if (!username) {
    showError('ไม่พบชื่อผู้ใช้ใน URL');
    return;
  }

  // Check if viewing own profile — use localStorage for instant render
  const userRaw = localStorage.getItem('sm_user');
  const me = userRaw ? JSON.parse(userRaw) : null;
  const profileRaw = localStorage.getItem('sm_profile');
  const myProfile = profileRaw ? JSON.parse(profileRaw) : null;

  if (me && me.username && me.username.toLowerCase() === username.toLowerCase() && myProfile) {
    renderProfile({
      success: true,
      username: me.username,
      display_name: myProfile.displayName || me.username,
      sports: me.sports || '',
      gender: me.gender || myProfile.gender || '',
      skill_level: myProfile.skillLevel || me.skill_level || '',
      province: myProfile.province || me.province || '',
      preferred_time: me.preferred_time || '',
      id_verify_status: me.id_verify_status || 'unverified',
      created_at: ''
    }, myProfile);
    return;
  }

  // Fetch from backend
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_DEPLOYED_URL') {
    showError('ไม่สามารถโหลดโปรไฟล์ในโหมด demo ได้');
    return;
  }

  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=getProfile&username=' + encodeURIComponent(username));
    const data = await res.json();
    if (!data.success) {
      showError(data.message || 'ไม่พบผู้ใช้นี้');
      return;
    }
    renderProfile(data, null);
  } catch (e) {
    showError('ไม่สามารถเชื่อมต่อได้ กรุณาลองใหม่');
  }
}

function renderProfile(data, myProfile) {
  document.getElementById('loading-box').style.display = 'none';
  document.getElementById('profile-box').style.display = 'block';

  const displayName = data.display_name || data.username;
  document.getElementById('top-title').textContent = displayName;
  document.getElementById('display-name-el').textContent = displayName;
  document.getElementById('username-el').textContent = '@' + data.username;

  // Avatar
  const avatarEl = document.getElementById('avatar-el');
  const photoSrc = (myProfile && myProfile.photoBase64) || data.photo_base64 || '';

  if (photoSrc) {
    avatarEl.innerHTML = `<img src="${photoSrc}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;">`;
    avatarEl.classList.add('has-photo');
    avatarEl.onclick = () => openLightbox(photoSrc);
  } else if (myProfile && myProfile.avatarEmoji) {
    avatarEl.textContent = myProfile.avatarEmoji;
    if (myProfile.avatarColor) avatarEl.style.background = myProfile.avatarColor;
  } else {
    avatarEl.textContent = '🏃';
  }

  // Verify badge
  const verifyEl = document.getElementById('verify-el');
  if (data.id_verify_status === 'approved') {
    verifyEl.innerHTML = `<span class="verify-badge">✓ ยืนยันตัวตนแล้ว</span>`;
  }

  // Join date
  if (data.created_at) {
    document.getElementById('join-date-el').textContent = 'สมาชิกตั้งแต่ ' + fmtDate(data.created_at);
  }

  // Info rows
  const rows = [];

  if (data.province) {
    rows.push(`<div class="info-row">
      <div class="info-icon">📍</div>
      <div>
        <div class="info-label">จังหวัด</div>
        <div class="info-value">${escapeHtml(data.province)}</div>
      </div>
    </div>`);
  }

  if (data.gender) {
    rows.push(`<div class="info-row">
      <div class="info-icon">👤</div>
      <div>
        <div class="info-label">เพศ</div>
        <div class="info-value">${escapeHtml(GENDER_LABELS[data.gender] || data.gender)}</div>
      </div>
    </div>`);
  }

  if (data.skill_level) {
    const sk = SKILL_LABELS[data.skill_level] || { th: data.skill_level, cls: 'skill-beginner', icon: '🌱' };
    rows.push(`<div class="info-row">
      <div class="info-icon">🏅</div>
      <div>
        <div class="info-label">ระดับ</div>
        <div class="info-value"><span class="skill-badge ${sk.cls}">${sk.icon} ${sk.th}</span></div>
      </div>
    </div>`);
  }

  if (data.sports) {
    const sportList = data.sports.split(',').map(s => s.trim()).filter(Boolean);
    if (sportList.length) {
      rows.push(`<div class="info-row">
        <div class="info-icon">🏃</div>
        <div>
          <div class="info-label">กีฬาที่ชอบ</div>
          <div class="sport-chips" style="margin-top:6px;">
            ${sportList.map(s => `<span class="sport-chip">${escapeHtml(s)}</span>`).join('')}
          </div>
        </div>
      </div>`);
    }
  }

  if (data.preferred_time) {
    const times = data.preferred_time.split(',').map(s => s.trim()).filter(Boolean);
    if (times.length) {
      rows.push(`<div class="info-row">
        <div class="info-icon">🕐</div>
        <div>
          <div class="info-label">ช่วงเวลาที่ว่าง</div>
          <div class="sport-chips" style="margin-top:6px;">
            ${times.map(t => `<span class="sport-chip">${escapeHtml(t)}</span>`).join('')}
          </div>
        </div>
      </div>`);
    }
  }

  if (myProfile && myProfile.bio) {
    rows.push(`<div class="info-row">
      <div class="info-icon">💬</div>
      <div>
        <div class="info-label">แนะนำตัว</div>
        <div class="info-value" style="font-weight:400;line-height:1.5;">${escapeHtml(myProfile.bio)}</div>
      </div>
    </div>`);
  }

  const infoCard = document.getElementById('info-card');
  if (rows.length) {
    infoCard.innerHTML = rows.join('');
  } else {
    infoCard.innerHTML = `<div class="info-row"><div style="color:var(--muted);font-size:13px;width:100%;text-align:center;padding:8px 0;">ยังไม่มีข้อมูลเพิ่มเติม</div></div>`;
  }
}

function showError(msg) {
  document.getElementById('loading-box').style.display = 'none';
  document.getElementById('error-box').style.display = 'flex';
  document.getElementById('error-msg').textContent = msg;
}

function openLightbox(src) {
  document.getElementById('photo-lightbox-img').src = src;
  document.getElementById('photo-lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('photo-lightbox').classList.remove('open');
  document.getElementById('photo-lightbox-img').src = '';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

loadProfile();
</script>
</body>
</html>
